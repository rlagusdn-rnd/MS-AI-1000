<!DOCTYPE html>
<html lang="ko">
<head>
    <TITLE>MS VISION</TITLE>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=yes, initial-scale=1.0, maximum-scale=3.0, minimum-scale=0.2, width=device-width" >
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="MICROSYSTEMS">
    <link rel="shortcut icon" href="./images/icon2.png">
    <script type="text/javascript" src="./js/jquery-3.5.1.min.js"></script>
    <script type="text/javascript" src="./js/jquery-ui.min.js"></script>
    <link rel="Stylesheet" type="text/css" href="./js/jquery-ui.min.css">
    <script type="text/javascript" src="./js/qwebchannel.js?d=1"></script>
    <link rel="stylesheet" type="text/css" href="style.css?d=1"/>
    <script type="text/javascript" src="./js/common.js?d=1"></script>
    <script type="text/javascript" src="main.js?d=1"></script>
</head>
<body class="login">
    <div class="login-bg-image"></div>
    <div class="login-wrap" style="">
        <div class="card login">
            <div class="logo_login"><img src="./images/logo.png" alt=""></div>
            <div class="flex_ver_wrap mt20">
                <form name="flogin">
                    <div class="title">아이디</div>
                    <input type="text" name="userid" value="" chk="str" msg="아이디를 입력하세요;"  autocomplete="username">
                    <div class="title">비밀번호</div>
                    <input class="mt10" type="password" name="password" value="" chk="str" msg="비밀번호를 입력하세요;" onkeydown="if (event.keyCode == 13) lg.login();"  autocomplete="new-password"
                    >
                </form>
                <a href="javascript:;" class="btn mt20" onclick="lg.login()">로그인</a>
            </div>
        </div>
        </div>
    </div>
    <a href="javascript:;" onclick="lg.exit()" class="btn-exit">종료하기</a>
</body>
</html>
